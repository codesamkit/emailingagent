<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 148 36" width="148" height="36" role="img" aria-label="Valence">
  <!-- Mark: nucleus + two crossed electron orbits. Orbits/electrons are electron blue;
       the wordmark inherits currentColor so the lockup works on light or dark. -->
  <g transform="translate(2 2)">
    <g transform="rotate(60 16 16)">
      <path d="M 3.5 16 A 12.5 5 0 1 0 28.5 16 A 12.5 5 0 1 0 3.5 16"
            fill="none" stroke="#0A84FF" stroke-width="1.3" opacity="0.6"/>
      <circle cx="28.5" cy="16" r="1.9" fill="#409CFF"/>
    </g>
    <g transform="rotate(-60 16 16)">
      <path d="M 3.5 16 A 12.5 5 0 1 0 28.5 16 A 12.5 5 0 1 0 3.5 16"
            fill="none" stroke="#0A84FF" stroke-width="1.3" opacity="0.6"/>
      <circle cx="3.5" cy="16" r="1.9" fill="#409CFF"/>
    </g>
    <circle cx="16" cy="16" r="2.5" fill="#0A84FF"/>
  </g>
  <text x="44" y="25.5" fill="currentColor"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, system-ui, Helvetica, sans-serif"
        font-size="19" font-weight="600" letter-spacing="-0.2">valence</text>
</svg>
