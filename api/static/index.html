<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valence — inbox review</title>
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161618">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231E1E20'/%3E%3Cg fill='none' stroke='%230A84FF' stroke-width='1.4'%3E%3Ccircle cx='16' cy='16' r='11.5'/%3E%3Ccircle cx='16' cy='16' r='7.5'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%230A84FF'/%3E%3Ccircle cx='21.7' cy='6.2' r='1.9' fill='%23409CFF'/%3E%3Ccircle cx='10.7' cy='21.3' r='1.9' fill='%23409CFF'/%3E%3C/svg%3E">
<style>
  /* ---------- Valence tokens — macOS-native palette (light on :root, dark via media + override) ---------- */
  :root {
    --bg: #f5f5f7;                        /* window chrome */
    --surface: #ffffff;                   /* content panes */
    --fill: rgba(120, 120, 128, 0.12);    /* control fills, macOS quaternary */
    --fill-2: rgba(120, 120, 128, 0.22);  /* control hover */
    --line: rgba(0, 0, 0, 0.08);          /* hairlines */
    --ink: #1d1d1f;
    --ink-soft: #5d5d63;
    --ink-faint: #86868b;
    --accent: #0071e3;                    /* systemBlue, darkened for AA text on white */
    --accent-vivid: #007aff;              /* systemBlue for fills & graphics */
    --accent-ink: #ffffff;
    --urgent: #d70015;                    /* systemRed (accessible light variant) */
    --ok: #1f8a3b;                        /* systemGreen (accessible light variant) */
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161618;
      --surface: #1e1e20;
      --fill: rgba(120, 120, 128, 0.26);
      --fill-2: rgba(120, 120, 128, 0.38);
      --line: rgba(255, 255, 255, 0.1);
      --ink: #f5f5f7;
      --ink-soft: #a1a1a6;
      --ink-faint: #7c7c80;
      --accent: #409cff;
      --accent-vivid: #0a84ff;
      --accent-ink: #ffffff;
      --urgent: #ff453a;
      --ok: #30d158;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161618;
    --surface: #1e1e20;
    --fill: rgba(120, 120, 128, 0.26);
    --fill-2: rgba(120, 120, 128, 0.38);
    --line: rgba(255, 255, 255, 0.1);
    --ink: #f5f5f7;
    --ink-soft: #a1a1a6;
    --ink-faint: #7c7c80;
    --accent: #409cff;
    --accent-vivid: #0a84ff;
    --accent-ink: #ffffff;
    --urgent: #ff453a;
    --ok: #30d158;
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    /* column flex so the queue fills whatever the (variable-height) header leaves */
    display: flex; flex-direction: column;
  }
  button { font: inherit; cursor: default; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent-vivid); outline-offset: 2px; }
  ::placeholder { color: var(--ink-faint); opacity: 1; }

  /* electrons in the logo: moving dots hidden when motion is reduced */
  .e-static { display: none; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
    .e-move { display: none; }
    .e-static { display: inline; }
  }

  /* ---------- toolbar ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    -webkit-backdrop-filter: blur(20px) saturate(1.8);
    backdrop-filter: blur(20px) saturate(1.8);
    border-bottom: 1px solid var(--line);
    padding: 10px 16px 0;
  }
  .masthead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand svg { display: block; }
  .brand .orbit { fill: none; stroke: var(--accent-vivid); stroke-width: 1.3; opacity: 0.5; }
  .brand .nucleus { fill: var(--accent-vivid); }
  .brand .e { fill: var(--accent-vivid); }
  .wordmark { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
  .processed-note { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .masthead .spacer { flex: 1; }
  .search {
    font-family: var(--sans); font-size: 13px;
    border: none; border-radius: 7px;
    background: var(--fill); color: var(--ink);
    padding: 6px 11px; width: 240px; max-width: 100%;
    transition: background-color 160ms var(--ease);
  }
  .search:hover { background: var(--fill-2); }
  .search:focus { outline: 2px solid var(--accent-vivid); outline-offset: 1px; }
  .theme-btn {
    display: grid; place-items: center;
    width: 30px; height: 30px; padding: 0;
    border: none; border-radius: 7px;
    background: var(--fill); color: var(--ink-soft);
    transition: background-color 160ms var(--ease), color 160ms var(--ease);
  }
  .theme-btn:hover { background: var(--fill-2); color: var(--ink); }
  .theme-btn svg { display: block; }

  /* filter chips — the stats row doubles as the level filter */
  .bins { display: flex; gap: 6px; flex-wrap: wrap; padding: 9px 0 10px; }
  .bin {
    display: inline-flex; align-items: baseline; gap: 6px;
    border: none; border-radius: 999px;
    background: var(--fill); padding: 4px 12px;
    color: var(--ink-soft);
    transition: background-color 160ms var(--ease), color 160ms var(--ease);
  }
  .bin:hover { background: var(--fill-2); }
  .bin b { font-size: 12.5px; color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .bin span { font-size: 12px; }
  .bin.active { background: var(--accent-vivid); color: var(--accent-ink); }
  .bin.active b { color: var(--accent-ink); }
  .bin:not(.active).urgent b { color: var(--urgent); }
  .bin:not(.active).high b { color: var(--accent); }
  /* topic chips share the bin look; the row only appears once topics exist */
  .bins.topics { padding-top: 0; }

  /* ---------- layout ---------- */
  main {
    display: grid; grid-template-columns: minmax(360px, 44%) 1fr;
    flex: 1; min-height: 300px;
    background: var(--surface);
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; flex: none; min-height: 0; }
    #detail { border-left: none; border-top: 1px solid var(--line); }
  }

  /* ---------- queue: flat macOS list, inset separators, tinted selection ---------- */
  #queue { overflow-y: auto; padding: 6px 8px 16px; }
  .row {
    position: relative;
    display: flex; gap: 12px; align-items: flex-start;
    width: 100%; text-align: left;
    background: transparent; color: inherit;
    border: none; border-radius: 9px;
    padding: 10px 10px 11px;
    transition: background-color 140ms var(--ease);
  }
  .row::after {
    content: ""; position: absolute; left: 64px; right: 10px; bottom: 0;
    height: 1px; background: var(--line);
  }
  .row:last-child::after, .row.selected::after { background: transparent; }
  .row:hover { background: var(--fill); }
  .row.selected { background: color-mix(in srgb, var(--accent-vivid) 14%, transparent); }
  .row .who { font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .row .who .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .charge {
    flex: none; width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent-vivid);
  }
  .row .subj { display: block; font-weight: 400; font-size: 13px; margin-top: 1px;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .sum { color: var(--ink-soft); font-size: 12px; margin-top: 2px;
              display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row .body { flex: 1; min-width: 0; }
  .meta { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
  .when { font-size: 11.5px; color: var(--ink-faint); flex: none; font-variant-numeric: tabular-nums; }

  /* the score ring — importance as an orbital shell, arc sweep = score */
  .shell { flex: none; display: grid; justify-items: center; gap: 1px; }
  .ring { display: grid; place-items: center; }
  .ring > * { grid-area: 1 / 1; }
  .ring svg { display: block; }
  .ring .track { fill: none; stroke: var(--fill-2); stroke-width: 2.5; }
  .ring .arc { fill: none; stroke-width: 2.5; stroke-linecap: round;
               transform: rotate(-90deg); transform-origin: center; }
  .ring.big .track, .ring.big .arc { stroke-width: 3; }
  .ring-val { font-size: 12.5px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
  .ring.big .ring-val { font-size: 18px; }
  .shell .lvl { font-size: 9px; text-transform: uppercase;
                letter-spacing: 0.05em; color: var(--ink-soft); font-weight: 500; }
  .shell.urgent .arc, .shell.urgent .dot { stroke: var(--urgent); fill: var(--urgent); }
  .shell.urgent .arc { fill: none; }
  .shell.urgent .ring-val, .shell.urgent .lvl { color: var(--urgent); }
  .shell.high .arc { stroke: var(--accent-vivid); }
  .shell.high .dot { fill: var(--accent-vivid); }
  .shell.high .ring-val { color: var(--accent); }
  .shell.medium .arc { stroke: var(--ink-soft); }
  .shell.medium .dot { fill: var(--ink-soft); }
  .shell.low .arc { stroke: var(--ink-faint); }
  .shell.low .dot { fill: var(--ink-faint); }
  .shell.low .ring-val, .shell.none .ring-val { color: var(--ink-faint); }

  .tag {
    font-size: 11px; font-weight: 500;
    border-radius: 999px; padding: 2px 8px;
    color: var(--ink-soft);
    background: var(--fill);
  }
  .tag.unread { color: var(--accent);
                background: color-mix(in srgb, var(--accent-vivid) 14%, transparent); }
  .tag.outline { color: var(--ok);
                 background: color-mix(in srgb, var(--ok) 13%, transparent); }

  /* skeleton rows while the queue loads */
  .skel { border-radius: 9px; padding: 10px; margin-bottom: 2px; display: flex; gap: 12px; }
  .skel .sc { width: 40px; height: 40px; border-radius: 50%; flex: none; }
  .skel .sl { height: 10px; border-radius: 5px; margin-bottom: 8px; }
  .skel .sc, .skel .sl {
    background: linear-gradient(100deg, var(--fill) 40%,
      color-mix(in srgb, var(--fill) 40%, transparent) 50%, var(--fill) 60%);
    background-size: 200% 100%;
    animation: shimmer 1.4s linear infinite;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }

  .empty { padding: 44px 24px; color: var(--ink-soft); font-size: 13px;
           max-width: 46ch; text-wrap: pretty; }
  .empty code { font-family: var(--mono); font-size: 11.5px; background: var(--fill);
                padding: 2px 6px; border-radius: 5px; }

  /* ---------- detail ---------- */
  #detail { overflow-y: auto; border-left: 1px solid var(--line);
            background: var(--surface); padding: 22px 26px 32px; }
  #detail .placeholder { color: var(--ink-faint); padding-top: 34px; }
  #detail .placeholder kbd {
    font-family: var(--mono); font-size: 11px;
    border-radius: 4px; padding: 1px 6px; background: var(--fill); color: var(--ink-soft);
  }
  .d-enter { animation: rise 220ms var(--ease); }
  @keyframes rise { from { opacity: 0; transform: translateY(3px); } }

  .d-head { display: flex; gap: 20px; align-items: flex-start; }
  .d-head .titles { flex: 1; min-width: 0; }
  .d-subject { font-size: 18px; font-weight: 600; letter-spacing: -0.01em;
               line-height: 1.3; text-wrap: balance; }
  .d-from { margin-top: 5px; font-size: 12.5px; color: var(--ink-soft); }
  .d-from .addr { font-family: var(--mono); font-size: 11px; }
  .d-tags { margin: 11px 0 2px; display: flex; gap: 5px; flex-wrap: wrap; }

  .section { margin-top: 22px; max-width: 72ch; }
  .section > h3 {
    font-size: 12px; font-weight: 600; letter-spacing: 0.01em;
    color: var(--ink-soft); border-bottom: 1px solid var(--line);
    padding-bottom: 5px; margin-bottom: 9px;
  }
  .justif { color: var(--ink-soft); font-size: 12.5px; }
  .message { white-space: pre-wrap; font-size: 13px; line-height: 1.65;
             overflow-wrap: break-word; }

  .outline-list { padding-left: 19px; }
  .outline-list li { margin-bottom: 6px; }
  .outline-list li::marker { color: var(--accent-vivid); }
  .slot-list { padding-left: 19px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .slot-list li { margin-bottom: 4px; }
  .slot-list li::marker { color: var(--accent-vivid); }

  textarea {
    font-family: var(--sans); font-size: 13px; line-height: 1.6;
    width: 100%; min-height: 130px;
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
    background: var(--fill); color: var(--ink); resize: vertical;
  }
  textarea:focus { outline: 2px solid var(--accent-vivid); outline-offset: 1px; }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn {
    border: none; border-radius: 7px; background: var(--fill);
    color: var(--ink); padding: 6px 14px; font-size: 13px; font-weight: 500;
    transition: background-color 140ms var(--ease);
  }
  .btn:hover { background: var(--fill-2); }
  .btn.primary { background: var(--accent-vivid); color: var(--accent-ink); font-weight: 600; }
  .btn.primary:hover { background: color-mix(in srgb, var(--accent-vivid) 88%, var(--ink)); }
  .btn:disabled { opacity: 0.45; }
  .btn:disabled:hover { background: var(--fill); }
  .btn.primary:disabled:hover { background: var(--accent-vivid); }

  .draft {
    white-space: pre-wrap; font-size: 13px; line-height: 1.6; max-width: 68ch;
    background: var(--fill); border-radius: 8px; padding: 13px 15px; margin-top: 10px;
  }
  .note { font-size: 12.5px; color: var(--ink-soft); margin-top: 8px; }
  .error { color: var(--urgent); font-size: 12.5px; margin-top: 8px; }
  .saved { color: var(--ok); font-size: 12.5px; margin-top: 8px; }
</style>
</head>
<body>

<header>
  <div class="masthead">
    <span class="brand">
      <svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true">
        <path id="o1" class="orbit" d="M 3.5 16 A 12.5 12.5 0 1 0 28.5 16 A 12.5 12.5 0 1 0 3.5 16"/>
        <circle class="e e-move" r="1.9">
          <animateMotion dur="17s" repeatCount="indefinite" begin="-4s"><mpath href="#o1"/></animateMotion>
        </circle>
        <circle class="e e-static" cx="16" cy="3.5" r="1.9"/>
        <path id="o2" class="orbit" d="M 8.5 16 A 7.5 7.5 0 1 0 23.5 16 A 7.5 7.5 0 1 0 8.5 16"/>
        <circle class="e e-move" r="1.9">
          <animateMotion dur="9s" repeatCount="indefinite" begin="-6s"><mpath href="#o2"/></animateMotion>
        </circle>
        <circle class="e e-static" cx="23.5" cy="16" r="1.9"/>
        <circle class="nucleus" cx="16" cy="16" r="2.5"/>
      </svg>
      <span class="wordmark">Valence</span>
    </span>
    <span class="processed-note" id="processedNote"></span>
    <span class="spacer"></span>
    <input class="search" id="search" type="search" placeholder="Search sender, subject, summary" aria-label="Search emails">
    <button class="theme-btn" id="themeBtn" aria-label="Theme: auto" title="Theme: auto"></button>
  </div>
  <div class="bins" id="bins" role="toolbar" aria-label="Filters"></div>
  <div class="bins topics" id="topics" role="toolbar" aria-label="Topic filters" hidden></div>
</header>

<main>
  <div id="queue" role="listbox" aria-label="Emails sorted by importance"></div>
  <div id="detail"><p class="placeholder">Select an email to review it — <kbd>j</kbd> / <kbd>k</kbd> walk the queue.</p></div>
</main>

<script>
"use strict";
const api = (path) => fetch(path).then(async (r) => {
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || (r.status + " " + r.statusText));
  return r.json();
});

const state = { level: null, category: null, unreadOnly: false, hideNoReply: false, search: "", selected: null, emails: [], loaded: false };

/* ---------- theme: auto → dark → light, persisted ---------- */
const THEME_KEY = "valence-theme";
const THEME_ICONS = {
  auto: '<svg width="15" height="15" viewBox="0 0 15 15" aria-hidden="true"><circle cx="7.5" cy="7.5" r="6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M7.5 1.5 A6 6 0 0 1 7.5 13.5 Z" fill="currentColor"/></svg>',
  dark: '<svg width="15" height="15" viewBox="0 0 15 15" aria-hidden="true"><path d="M12.5 9.5A5.7 5.7 0 0 1 5.5 2.5a6 6 0 1 0 7 7Z" fill="currentColor"/></svg>',
  light: '<svg width="15" height="15" viewBox="0 0 15 15" aria-hidden="true"><circle cx="7.5" cy="7.5" r="3.2" fill="currentColor"/><g stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M7.5 0.8v2M7.5 12.2v2M0.8 7.5h2M12.2 7.5h2M2.8 2.8l1.4 1.4M10.8 10.8l1.4 1.4M12.2 2.8l-1.4 1.4M4.2 10.8l-1.4 1.4"/></g></svg>',
};
function applyTheme(mode) {
  if (mode === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", mode);
  const btn = document.getElementById("themeBtn");
  btn.innerHTML = THEME_ICONS[mode];
  btn.setAttribute("aria-label", "Theme: " + mode + " (click to change)");
  btn.title = "Theme: " + mode;
}
let themeMode = localStorage.getItem(THEME_KEY) || "auto";
if (!THEME_ICONS[themeMode]) themeMode = "auto";
applyTheme(themeMode);
document.getElementById("themeBtn").addEventListener("click", () => {
  themeMode = { auto: "dark", dark: "light", light: "auto" }[themeMode];
  localStorage.setItem(THEME_KEY, themeMode);
  applyTheme(themeMode);
});

/* ---------- helpers ---------- */
function ago(iso) {
  if (!iso) return "";
  const h = (Date.now() - new Date(iso)) / 3600000;
  if (h < 1) return Math.max(1, Math.round(h * 60)) + "m ago";
  if (h < 48) return Math.round(h) + "h ago";
  return Math.round(h / 24) + "d ago";
}
function esc(s) {
  return (s || "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function senderName(s) {
  const m = (s || "").match(/^\s*"?([^"<]+?)"?\s*</);
  return m ? m[1] : (s || "");
}

/* the score shell — importance drawn as an orbital arc, sweep = score/100 */
function shell(email, big) {
  const lvl = email.importanceLevel || "none";
  const score = email.importanceScore == null ? null : Math.round(email.importanceScore);
  const size = big ? 64 : 40, r = big ? 28.5 : 17.25;
  const c = 2 * Math.PI * r, cx = size / 2;
  const frac = score == null ? 0 : Math.max(0.03, Math.min(1, score / 100));
  const ang = -Math.PI / 2 + frac * 2 * Math.PI;
  const arc = score == null ? "" :
    `<circle class="arc" cx="${cx}" cy="${cx}" r="${r}" stroke-dasharray="${(c * frac).toFixed(2)} ${c.toFixed(2)}"/>
     <circle class="dot" cx="${(cx + r * Math.cos(ang)).toFixed(2)}" cy="${(cx + r * Math.sin(ang)).toFixed(2)}" r="${big ? 3.4 : 2.5}"/>`;
  return `<span class="shell ${lvl} ${big ? "big" : ""}" role="img"
    aria-label="importance ${score == null ? "unscored" : score + " of 100, " + lvl}"
    title="importance ${score == null ? "–" : score} (${lvl})">
    <span class="ring ${big ? "big" : ""}">
      <svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-hidden="true">
        <circle class="track" cx="${cx}" cy="${cx}" r="${r}"/>${arc}
      </svg>
      <span class="ring-val">${score == null ? "–" : score}</span>
    </span>
    <span class="lvl">${lvl === "none" ? "unscored" : lvl}</span>
  </span>`;
}
function tags(email) {
  const t = [];
  if (email.readStatus === "unread") t.push('<span class="tag unread">unread</span>');
  if (email.category) t.push('<span class="tag topic">' + esc(email.category) + "</span>");
  if (email.isNoReply) t.push('<span class="tag noreply">no-reply</span>');
  if (email.isSchedulingRelated) t.push('<span class="tag sched">scheduling</span>');
  if (email.replyOutline) t.push('<span class="tag outline">outline ' + esc(email.replyOutlineStatus) + "</span>");
  return t.join("");
}

/* ---------- bins (stats that filter) ---------- */
async function renderBins() {
  const s = await api("/api/stats");
  document.getElementById("processedNote").textContent =
    s.total + " emails processed · " + s.withOutline + " with reply outlines";
  const bins = [
    { key: null, label: "all", n: s.total },
    { key: "urgent", label: "urgent", n: s.byLevel.urgent },
    { key: "high", label: "high", n: s.byLevel.high },
    { key: "medium", label: "medium", n: s.byLevel.medium },
    { key: "low", label: "low", n: s.byLevel.low },
  ];
  const el = document.getElementById("bins");
  el.innerHTML = bins.map((b) =>
    `<button class="bin ${b.key || "all"} ${state.level === b.key ? "active" : ""}" data-level="${b.key || ""}"
             aria-pressed="${state.level === b.key}">
       <b>${b.n}</b><span>${b.label}</span></button>`).join("") +
    `<button class="bin toggle ${state.unreadOnly ? "active" : ""}" id="unreadToggle" aria-pressed="${state.unreadOnly}"><b>${s.unread}</b><span>unread only</span></button>
     <button class="bin toggle ${state.hideNoReply ? "active" : ""}" id="noReplyToggle" aria-pressed="${state.hideNoReply}"><b>${s.noReply}</b><span>hide no-reply</span></button>`;
  el.querySelectorAll("[data-level]").forEach((b) =>
    b.addEventListener("click", () => { state.level = b.dataset.level || null; refresh(); }));
  el.querySelector("#unreadToggle").addEventListener("click", () => { state.unreadOnly = !state.unreadOnly; refresh(); });
  el.querySelector("#noReplyToggle").addEventListener("click", () => { state.hideNoReply = !state.hideNoReply; refresh(); });

  // topic chips — free-form categories, top-N by count; click toggles
  const topicsEl = document.getElementById("topics");
  const topics = Object.entries(s.byCategory || {});
  topicsEl.hidden = !topics.length;
  topicsEl.innerHTML = topics.map(([topic, n]) =>
    `<button class="bin ${state.category === topic ? "active" : ""}" data-topic="${esc(topic)}"
             aria-pressed="${state.category === topic}">
       <b>${n}</b><span>${esc(topic)}</span></button>`).join("");
  topicsEl.querySelectorAll("[data-topic]").forEach((b) =>
    b.addEventListener("click", () => {
      state.category = state.category === b.dataset.topic ? null : b.dataset.topic;
      refresh();
    }));
}

/* ---------- queue ---------- */
function skeletons() {
  return Array.from({ length: 6 }, () => `
    <div class="skel" aria-hidden="true"><span class="sc"></span>
      <span style="flex:1"><span class="sl" style="width:45%"></span><span class="sl" style="width:80%"></span><span class="sl" style="width:65%; margin-bottom:0"></span></span>
    </div>`).join("");
}
async function renderQueue() {
  const el = document.getElementById("queue");
  if (!state.loaded) el.innerHTML = skeletons();
  const q = new URLSearchParams({ sortBy: "importance", descending: "true", limit: "500" });
  if (state.level) q.set("importance", state.level);
  if (state.category) q.set("category", state.category);
  if (state.unreadOnly) q.set("readStatus", "unread");
  if (state.hideNoReply) q.set("noReply", "false");
  if (state.search) q.set("search", state.search);
  const data = await api("/api/emails?" + q);
  state.emails = data.emails;
  state.loaded = true;
  if (!data.emails.length) {
    el.innerHTML = state.search || state.level || state.category || state.unreadOnly || state.hideNoReply
      ? '<div class="empty">Nothing matches these filters.</div>'
      : '<div class="empty">No processed emails yet. Ingest and process first: <code>python -m pipeline.cli process</code></div>';
    return;
  }
  el.innerHTML = data.emails.map((e) => `
    <button class="row ${e.isNoReply ? "noreply" : ""} ${state.selected === e.emailId ? "selected" : ""}"
            data-id="${e.emailId}" role="option" aria-selected="${state.selected === e.emailId}">
      ${shell(e)}
      <span class="body">
        <span class="who">${e.readStatus === "unread" ? '<span class="charge" title="unread"></span>' : ""}<span class="name">${esc(senderName(e.sender))}</span></span>
        <span class="subj">${esc(e.subject) || "(no subject)"}</span>
        ${e.summary ? `<span class="sum">${esc(e.summary)}</span>` : ""}
        <span class="meta">${tags(e)}</span>
      </span>
      <span class="when">${ago(e.receivedAt)}</span>
    </button>`).join("");
  el.querySelectorAll(".row").forEach((r) =>
    r.addEventListener("click", () => select(r.dataset.id)));
}

/* ---------- detail ---------- */
async function select(id) {
  state.selected = id;
  document.querySelectorAll(".row").forEach((r) => {
    r.classList.toggle("selected", r.dataset.id === id);
    r.setAttribute("aria-selected", r.dataset.id === id);
  });
  const el = document.getElementById("detail");
  let e;
  try { e = await api("/api/emails/" + id); }
  catch (err) { el.innerHTML = `<p class="error">${esc(err.message)}</p>`; return; }

  const slots = e.calendarContext && e.calendarContext.suggestedSlots || [];
  el.innerHTML = `<div class="d-enter">
    <div class="d-head">
      <div class="titles">
        <h2 class="d-subject">${esc(e.subject) || "(no subject)"}</h2>
        <p class="d-from">${esc(senderName(e.sender))} · <span class="addr">${esc(e.sender)}</span><br>
           received ${ago(e.receivedAt)} · ${e.readStatus}</p>
        <div class="d-tags">${tags(e)}</div>
      </div>
      ${shell(e, true)}
    </div>

    <div class="section"><h3>Summary</h3>
      <p>${esc(e.summary) || '<span class="note">Not summarized yet.</span>'}</p></div>

    <div class="section"><h3>Message</h3>
      ${e.body ? `<div class="message">${esc(e.body)}</div>`
        : '<p class="note">Original message text unavailable — re-run ingestion to restore it.</p>'}</div>

    <div class="section"><h3>Why this score</h3>
      <p class="justif">${esc(e.importanceJustification) || "Not scored yet."}</p>
      ${e.isNoReply && e.noReplyReason ? `<p class="note">Flagged no-reply: ${esc(e.noReplyReason)}</p>` : ""}</div>

    ${slots.length ? `<div class="section"><h3>Open slots on your calendar</h3>
      <ul class="slot-list">${slots.map((s) =>
        `<li>${new Date(s.start).toLocaleString([], {weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit"})}
         – ${new Date(s.end).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})}</li>`).join("")}</ul></div>` : ""}

    <div class="section"><h3>Reply outline</h3><div id="outlineArea"></div></div>
    <div class="section" id="draftSection" hidden><h3>Full draft (review before sending)</h3>
      <div class="draft" id="draftText"></div>
      <div class="actions"><button class="btn" id="copyDraft">Copy draft</button></div></div>
  </div>`;
  renderOutline(e);
}

function renderOutline(e) {
  const area = document.getElementById("outlineArea");
  if (!e.outlineEligible && !e.replyOutline) {
    const why = e.isNoReply ? "This is no-reply mail — it never gets a reply outline."
      : e.readStatus === "unread" ? "Unread — an outline is drafted once you have read the email."
      : "Not classified yet — run the pipeline.";
    area.innerHTML = `<p class="note">${why}</p>`;
    return;
  }
  if (!e.replyOutline) {
    area.innerHTML = '<p class="note">No outline yet — the next pipeline run will draft one.</p>';
    return;
  }
  area.innerHTML = `
    <ul class="outline-list">${e.replyOutline.map((b) => `<li>${esc(b)}</li>`).join("")}</ul>
    <div class="actions">
      <button class="btn" id="editOutline">Edit outline</button>
      <button class="btn primary" id="expandBtn">Expand to full draft</button>
    </div><div id="outlineMsg"></div>`;
  document.getElementById("editOutline").addEventListener("click", () => editOutline(e));
  document.getElementById("expandBtn").addEventListener("click", () => expandDraft(e));
}

function editOutline(e) {
  const area = document.getElementById("outlineArea");
  area.innerHTML = `
    <textarea id="outlineInput" aria-label="Outline bullets, one per line">${esc(e.replyOutline.join("\n"))}</textarea>
    <p class="note">One bullet per line.</p>
    <div class="actions">
      <button class="btn primary" id="saveOutline">Save outline</button>
      <button class="btn" id="cancelEdit">Cancel</button>
    </div><div id="outlineMsg"></div>`;
  document.getElementById("cancelEdit").addEventListener("click", () => renderOutline(e));
  document.getElementById("saveOutline").addEventListener("click", async () => {
    const lines = document.getElementById("outlineInput").value.split("\n").map((l) => l.trim()).filter(Boolean);
    const msg = document.getElementById("outlineMsg");
    try {
      const r = await fetch("/api/emails/" + e.emailId + "/outline", {
        method: "PATCH", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ outline: lines }),
      });
      if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
      const updated = await r.json();
      renderOutline(updated);
      document.getElementById("outlineMsg").innerHTML = '<p class="saved">Outline saved.</p>';
      renderQueue();
    } catch (err) { msg.innerHTML = `<p class="error">${esc(err.message)}</p>`; }
  });
}

async function expandDraft(e) {
  const btn = document.getElementById("expandBtn");
  const msg = document.getElementById("outlineMsg");
  btn.disabled = true; btn.textContent = "Expanding…";
  try {
    const r = await fetch("/api/emails/" + e.emailId + "/expand", { method: "POST" });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    const body = await r.json();
    const section = document.getElementById("draftSection");
    section.hidden = false;
    document.getElementById("draftText").textContent = body.draft;
    document.getElementById("copyDraft").onclick = () =>
      navigator.clipboard.writeText(body.draft).catch(() => {});
    section.scrollIntoView({ behavior: "smooth", block: "nearest" });
  } catch (err) {
    msg.innerHTML = `<p class="error">${esc(err.message)}</p>`;
  } finally {
    btn.disabled = false; btn.textContent = "Expand to full draft";
  }
}

/* ---------- keyboard: j/k or arrows walk the queue ---------- */
document.addEventListener("keydown", (ev) => {
  if (ev.target.matches("input, textarea")) return;
  if (!["ArrowDown", "ArrowUp", "j", "k"].includes(ev.key)) return;
  ev.preventDefault();
  const ids = state.emails.map((e) => e.emailId);
  if (!ids.length) return;
  const at = ids.indexOf(state.selected);
  const next = (ev.key === "ArrowDown" || ev.key === "j")
    ? ids[Math.min(at + 1, ids.length - 1)] : ids[Math.max(at - 1, 0)];
  select(next);
  const row = document.querySelector(`.row[data-id="${next}"]`);
  if (row) row.scrollIntoView({ block: "nearest" });
});

let searchTimer;
document.getElementById("search").addEventListener("input", (ev) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { state.search = ev.target.value.trim(); refresh(); }, 250);
});

function refresh() { renderBins(); renderQueue(); }
refresh();
</script>
</body>
</html>
