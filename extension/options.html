<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Valence options</title>
    <style>
      :root {
        --bg: #0a0e1a;
        --bg-2: #0e1428;
        --surface: #11182e;
        --border: rgba(124, 156, 255, 0.18);
        --grid-line: rgba(124, 156, 255, 0.07);
        --accent: #4c7cfa;
        --accent-strong: #7ea0ff;
        --accent-bg: rgba(76, 124, 250, 0.16);
        --text: #e8ecf8;
        --text-muted: #8992ad;
        --success: #4ddb9b;
      }

      * { box-sizing: border-box; }

      body {
        font: 14px/1.5 Roboto, Arial, sans-serif;
        color: var(--text);
        margin: 0;
        padding: 40px 24px;
        min-height: 100vh;
        background:
          linear-gradient(180deg, var(--grid-line) 1px, transparent 1px) 0 0 / 100% 28px,
          linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0 / 28px 100%,
          radial-gradient(ellipse 600px 400px at 50% 0%, rgba(76, 124, 250, 0.14), transparent 70%),
          var(--bg);
      }

      .card {
        max-width: 440px;
        margin: 0 auto;
        background: var(--bg-2);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 28px 28px 24px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 22px;
      }

      .brand-logo {
        width: 32px;
        height: 32px;
        background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+CiAgPGcgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjNGM3Y2ZhIiBzdHJva2Utd2lkdGg9IjMiPgogICAgPGVsbGlwc2UgY3g9IjMyIiBjeT0iMzIiIHJ4PSIyOCIgcnk9IjEyIi8+CiAgICA8ZWxsaXBzZSBjeD0iMzIiIGN5PSIzMiIgcng9IjI4IiByeT0iMTIiIHRyYW5zZm9ybT0icm90YXRlKDYwIDMyIDMyKSIvPgogICAgPGVsbGlwc2UgY3g9IjMyIiBjeT0iMzIiIHJ4PSIyOCIgcnk9IjEyIiB0cmFuc2Zvcm09InJvdGF0ZSgxMjAgMzIgMzIpIi8+CiAgPC9nPgogIDxjaXJjbGUgY3g9IjMyIiBjeT0iMzIiIHI9IjciIGZpbGw9IiM0YzdjZmEiLz4KICA8Y2lyY2xlIGN4PSI2MCIgY3k9IjMyIiByPSI0IiBmaWxsPSIjNmY5N2ZmIi8+CiAgPGNpcmNsZSBjeD0iMTYiIGN5PSIxNiIgcj0iNCIgZmlsbD0iIzZmOTdmZiIvPgogIDxjaXJjbGUgY3g9IjE2IiBjeT0iNDgiIHI9IjQiIGZpbGw9IiM2Zjk3ZmYiLz4KPC9zdmc+Cg==");
        background-size: contain;
        background-repeat: no-repeat;
      }

      h2 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: 0.2px; }

      label {
        display: block;
        font-weight: 600;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-muted);
        margin-bottom: 6px;
      }

      input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text);
        font-size: 14px;
        box-sizing: border-box;
      }

      input::placeholder { color: var(--text-muted); }
      input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }

      button {
        margin-top: 14px;
        padding: 9px 18px;
        border: 1px solid var(--accent);
        border-radius: 8px;
        background: var(--accent);
        color: #050810;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
      }

      button:hover { background: var(--accent-strong); border-color: var(--accent-strong); }

      #status { margin-left: 10px; color: var(--success); font-weight: 600; font-size: 13px; }

      p.hint { color: var(--text-muted); font-size: 12px; margin: 8px 0 20px; }
      p.hint code {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 5px;
        color: var(--accent-strong);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <div class="brand-logo"></div>
        <h2>Valence</h2>
      </div>
      <label for="backendUrl">Backend URL</label>
      <input id="backendUrl" type="url" placeholder="http://127.0.0.1:8000" />
      <p class="hint">Where the FastAPI backend is running (<code>uvicorn api.main:app</code>).</p>
      <button id="save">Save</button><span id="status"></span>
    </div>
    <script src="options.js"></script>
  </body>
</html>
